spring.application.name=neuro

# MySQL Database Configuration matching DATABASE.md
# Set credentials via environment variables or a local application-local.properties file (not committed).
# Example:
#   SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/neuro_focus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#   SPRING_DATASOURCE_USERNAME=your_db_user
#   SPRING_DATASOURCE_PASSWORD=your_db_password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/neuro_focus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080
